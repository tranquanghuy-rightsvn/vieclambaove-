# Build site tĩnh từ data/site.json rồi deploy lên Cloudflare Worker "vieclambaove".
# Chạy khi: push lên main (gồm commit dữ liệu do Worker tự đẩy lên), mỗi ngày 00:05 giờ VN
# (làm mới "còn N ngày" trong HTML), hoặc bấm tay trong tab Actions.
# Cần 2 secret của repo: CLOUDFLARE_API_TOKEN (quyền Edit Cloudflare Workers), CLOUDFLARE_ACCOUNT_ID.
name: Build & deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '5 17 * * *'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sinh trang tĩnh
        run: node scripts/build.mjs
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://vieclambaove.web100-vn.workers.dev' }}
      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
