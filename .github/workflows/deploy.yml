# Sinh site tĩnh vào html/ rồi commit lại repo. KHÔNG deploy, KHÔNG cần secret Cloudflare:
# Cloudflare Workers Builds nối thẳng repo này, thấy html/ đổi thì tự deploy.
# Chạy khi: Worker commit data/site.json (tin lên/gỡ, video, công ty…), sửa giao diện/script build,
# mỗi ngày 00:10 giờ VN (làm mới "còn N ngày"), hoặc bấm tay ở tab Actions.
name: Build html

on:
  push:
    branches: [main]
    paths: ['data/**', 'assets/**', 'scripts/**', 'index.html', 'quan-tri/**', 'package.json', 'package-lock.json', '.github/workflows/deploy.yml']
  schedule:
    - cron: '10 17 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-html
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sinh trang tĩnh (scripts/build.mjs không cần cài thư viện)
        run: node scripts/build.mjs
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://vieclambaove.web100-vn.workers.dev' }}
      - name: Commit html/
        run: |
          git config user.name "vieclambaove-ci"
          git config user.email "ci@vieclambaove.invalid"
          git add -A html
          if git diff --cached --quiet; then echo "html/ không đổi"; exit 0; fi
          git commit -m "CI: build html"
          # Worker có thể vừa commit dữ liệu mới trong lúc build → rebase rồi đẩy lại
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 5; done
          exit 1
